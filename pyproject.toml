[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-video-studio"
version = "0.1.0"
description = "Native desktop AI-assisted video creation studio"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "PySide6>=6.10.2,<7",
  "psutil>=7.2,<8",
  "Pillow>=12,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
ai = [
  "faster-whisper>=1.2.1,<2",
  "ctranslate2>=4.8.2,<5",
]
tts = [
  "voxcpm>=2.0.3,<3",
  "soundfile>=0.13,<1",
]
translation = [
  "transformers>=5.17,<6",
  "torch>=2.5",
  "sentencepiece>=0.2,<1",
]

[project.scripts]
sp-video-studio = "app.phase25_runtime:run"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: opt-in integration tests that require external runtime dependencies",
  "voxcpm: opt-in real VoxCPM2 model tests",
  "faster_whisper: opt-in real faster-whisper model tests",
  "translation: opt-in real local translation model tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "domain*", "engines*", "workers*", "services*", "storage*", "media*", "rendering*", "workflows*", "ui*"]
