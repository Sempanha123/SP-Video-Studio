[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-video-studio"
version = "0.1.0"
description = "Native desktop AI-assisted video creation studio"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
ai = [
  "faster-whisper>=1.1,<2",
]

[project.scripts]
sp-video-studio = "app.bootstrap:run"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "domain*", "engines*", "workers*", "services*", "storage*", "media*", "rendering*", "workflows*", "ui*"]
