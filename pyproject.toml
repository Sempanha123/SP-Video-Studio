[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-video-studio"
dynamic = ["version"]
description = "Native desktop AI-assisted video creation studio"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "PySide6>=6.10.2,<7",
  "psutil>=7.2,<8",
  "Pillow>=12,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]
ai = ["faster-whisper>=1.2.1,<2", "ctranslate2>=4.8.2,<5"]
tts = ["voxcpm>=2.0.3,<3", "soundfile>=0.13,<1"]
translation = ["transformers>=5.17,<6", "torch>=2.5", "sentencepiece>=0.2,<1"]

[project.scripts]
# Phase 40 adds packaged-runtime safeguards on the completed Phase 39 release line.
sp-video-studio = "app.phase40_runtime:run"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: opt-in integration tests that require external runtime dependencies",
  "voxcpm: opt-in real VoxCPM2 model tests",
  "faster_whisper: opt-in real faster-whisper model tests",
  "translation: opt-in real local translation model tests",
  "fast: normal developer test profile; no huge models or external runtime dependencies",
  "e2e: deterministic end-to-end workflow tests with tiny media and fake AI engines",
  "real_engine_optional: optional installed-model smoke tests; never required by standard CI",
  "packaging_smoke: packaging/import/resource sanity checks",
  "qml_smoke: QML load/compile smoke checks when Qt tooling is available",
  "performance: non-flaky Phase 31 scale sanity checks",
  "fault_injection: controlled failure-path tests",
  "security: Phase 37 security regression coverage",
  "migration: Phase 38 migration regression coverage",
  "windows: Windows-specific filesystem/process acceptance checks",
]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.dynamic]
version = {attr = "app.constants.APP_VERSION"}
[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "domain*", "engines*", "workers*", "services*", "storage*", "media*", "rendering*", "workflows*", "ui*", "migrations*"]
